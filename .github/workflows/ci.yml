name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api-schema:
    name: API schema tests (Schemathesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expenses
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/expenses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api-tests]"
      - run: pytest tests/api -v

  # ui-tests (Selenium) and perf-smoke (Locust) are added on Day 2 alongside
  # the test suites they run — an empty job with no tests behind it yet
  # would just be dead scaffolding.
